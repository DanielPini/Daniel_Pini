    <meta charset="UTF-8" />

    <title>
      Navigating Distance and Closeness with Niki and Hamish | Developing the

    </title>

  <body class="ndac-background developing-background">
    <main class="developing-instruments-main">
      <section class="developing-instruments-flex-layout">
        <div class="stems-container">
          <div class="ceramic-table-container">
            <div class="object-wrapper">
              <div class="object" id="object1"></div>
              <div class="object" id="object2"></div>
              <div class="object" id="object3"></div>
              <div class="object" id="object4"></div>
              <div class="object" id="object5"></div>
            </div>
            <picture>
              <source
                media="(min-width: 701px)"
                srcset="./assets/images/ceramics.png"
              />
              <source
                media="(max-width: 700px)"
                srcset="./assets/images/ceramics-focussed.webp"
              />
              <img
                id="ceramic-table"
                src="./assets/images/ceramics.png"
                alt="Table with numbered white ceramic instruments arranged."
              />
            </picture>
          </div>
        </div>
      </section>
    </main>

    <div class="audio">
      <audio
        id="clickSound1"
        src="./assets/instrument_stems/ceramic7_c.mp3"
      ></audio>
      <audio
        id="horizontalDragSound1"
        src="./assets/instrument_stems/ceramic7_h.mp3"

      <audio
        id="verticalDragSound1"
        src="./assets/instrument_stems/ceramic7_v.mp3"
      ></audio>

      <audio
        id="clickSound2"
        src="./assets/instrument_stems/ceramic6_c.mp3"

      <audio

      <audio
        id="verticalDragSound2"

      ></audio>

      <audio
        id="clickSound3"
        src="./assets/instrument_stems/ceramic1_c.mp3"
      ></audio>
      <audio
        id="horizontalDragSound3"
        src="./assets/instrument_stems/ceramic1_h.mp3"

      <audio
        id="verticalDragSound3"

      <audio

        src="./assets/instrument_stems/ceramic2_h.mp3"
